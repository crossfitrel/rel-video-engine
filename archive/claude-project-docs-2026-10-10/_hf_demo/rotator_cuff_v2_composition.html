  <body>
    <div id="main" data-composition-id="main" data-width="1040" data-height="1090" data-start="0" data-duration="6">
      <div class="scene clip" id="s1" data-start="0" data-duration="6" data-track-index="0">
        <div class="scene-content">
          <div id="stage">
            <div id="basefx" class="plate"></div>
            <div class="glow" id="gl-infra"></div>
            <div class="glow" id="gl-supra"></div>
            <div class="glow" id="gl-sub"></div>
            <div class="glow" id="gl-teres"></div>
            <div class="hl" id="hl-sub"><div class="plate"></div><div class="tint"></div><div class="lift"></div></div>
            <div class="hl" id="hl-infra"><div class="plate"></div><div class="tint"></div><div class="lift"></div></div>
            <div class="hl" id="hl-supra"><div class="plate"></div><div class="tint"></div><div class="lift"></div></div>
            <div class="hl" id="hl-teres"><div class="plate"></div><div class="tint"></div><div class="lift"></div></div>
          </div>
          <div class="vignette"></div>
          <div class="grain"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // cue windows, locked to the spoken words (video t = cue + 22.6s)
      var CUES = [
        { k: "infra", on: 1.30, off: 2.72 },  // אינפרספינטוס
        { k: "supra", on: 2.80, off: 3.70 },  // סופרספינטוס
        { k: "sub",   on: 3.75, off: 4.70 },  // סאבסקפולריס  (far side of the blade)
        { k: "teres", on: 4.75, off: 5.66 }   // טרס מינור
      ];

      // establishing + slow push-in across the whole insert
      tl.from("#stage", { scale: 1.10, autoAlpha: 0, transformOrigin: "50% 46%", duration: 0.9, ease: "power3.out" }, 0.05);
      tl.to("#stage", { scale: 1.045, transformOrigin: "50% 46%", duration: 5.0, ease: "sine.inOut" }, 0.95);

      CUES.forEach(function (c) {
        var hl = "#hl-" + c.k, gl = "#gl-" + c.k;
        var peak = c.k === "sub" ? 0.55 : 1.0;
        var glowPeak = c.k === "sub" ? 0.08 : 0.20;

        // dim the resting illustration so the lit muscle carries the eye
        tl.to("#basefx", { filter: "brightness(0.66) saturate(0.78)", duration: 0.24, ease: "power2.out" }, c.on);
        tl.to(hl, { opacity: peak, duration: 0.24, ease: "power2.out" }, c.on);
        tl.fromTo(gl, { opacity: 0 }, { opacity: glowPeak, duration: 0.26, ease: "power2.out" }, c.on);
        // breathing pulse while lit
        tl.to(gl, { opacity: glowPeak * 0.55, duration: Math.max(0.2, (c.off - c.on - 0.3) / 2), ease: "sine.inOut", yoyo: true, repeat: 1 }, c.on + 0.28);
        // release
        tl.to(hl, { opacity: 0, duration: 0.26, ease: "power2.in" }, c.off);
        tl.to(gl, { opacity: 0, duration: 0.26, ease: "power2.in" }, c.off);
        tl.to("#basefx", { filter: "brightness(1) saturate(1)", duration: 0.26, ease: "power2.in" }, c.off);
      });

      // payoff: all four together
      tl.to("#basefx", { filter: "brightness(0.66) saturate(0.78)", duration: 0.28, ease: "power2.out" }, 5.66);
      ["infra", "supra", "sub", "teres"].forEach(function (k, i) {
        tl.to("#hl-" + k, { opacity: k === "sub" ? 0.52 : 1, duration: 0.26, ease: "power3.out" }, 5.66 + i * 0.05);
        tl.to("#gl-" + k, { opacity: k === "sub" ? 0.07 : 0.18, duration: 0.26, ease: "power3.out" }, 5.66 + i * 0.05);
      });

      window.__timelines["main"] = tl;
    </script>
