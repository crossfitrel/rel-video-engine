<!doctype html>
<html lang="he" style="overflow:hidden; margin:0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <style>
      :root { --bg:#141011; --hot:#8E1A1F;
/*PLATES*/
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:__W__px; height:__H__px; overflow:hidden; background:var(--bg); }
      .scene { position:absolute; inset:0; overflow:hidden; }
      .scene-content { position:relative; width:100%; height:100%; }
      #stage { position:absolute; inset:0; perspective:2200px; }
      .face  { position:absolute; inset:0; backface-visibility:hidden; }
      .plate { position:absolute; inset:0; background-size:100% 100%; background-repeat:no-repeat; }
      .p-post { background-image:var(--plate-post); }
      .p-ant  { background-image:var(--plate-ant); }

      .hl { position:absolute; inset:0; isolation:isolate; opacity:0;
            filter:saturate(1.18) contrast(1.06);
            -webkit-mask-size:100% 100%; mask-size:100% 100%;
            -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
      .hl .tint { position:absolute; inset:0; background:var(--hot); mix-blend-mode:color; }
      .hl .lift { position:absolute; inset:0; background:rgba(255,110,100,0.05); mix-blend-mode:screen; }
      .glow { position:absolute; inset:0; opacity:0; pointer-events:none;
              background:#C2222B; filter:blur(30px); mix-blend-mode:screen;
              -webkit-mask-size:100% 100%; mask-size:100% 100%;
              -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }

      /* מסכות ותמונות מוטמעות base64 — mask-image מ-file:// נחסם ב-Chrome
         והשכבה נעלמת בשקט (L48, 21.8.26). */
/*MASKS*/

      .vignette { position:absolute; inset:0; z-index:8; pointer-events:none;
        background: radial-gradient(ellipse at 48% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.60) 100%); }
      .grain { position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0.10; mix-blend-mode:overlay;
        background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.2px), radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.2px);
        background-size: 3px 3px, 5px 5px; background-position: 0 0, 1px 2px; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="__W__" data-height="__H__" data-start="0" data-duration="__DUR__">
      <div class="scene clip" id="s1" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div class="scene-content">
          <div id="stage">
            <!--DOM-->
          </div>
          <div class="vignette"></div>
          <div class="grain"></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DUR = __DUR__;
      var shown = "post";

      gsap.set("#face-post", { rotationY: 0, transformOrigin: "50% 50%" });
      if (document.querySelector("#face-ant"))
        gsap.set("#face-ant", { rotationY: -180, transformOrigin: "50% 50%" });

      tl.from("#stage", { scale: 1.10, autoAlpha: 0, transformOrigin: "50% 46%",
                          duration: 0.9, ease: "power3.out" }, 0.05);
      tl.to("#stage", { scale: 1.04, transformOrigin: "50% 46%",
                        duration: Math.max(0.5, DUR - 1.0), ease: "sine.inOut" }, 0.95);

      // היפוך הקלף — כשהישות חיה על הצד השני של המבנה, מראים את הצד השני
      // במקום לזייף אותו על התצוגה הנוכחית.
      function flip(to, at) {
        if (to === shown) return;
        var from = shown;
        tl.to("#face-" + from, { rotationY: "+=180", duration: 0.34, ease: "power2.inOut" }, at);
        tl.to("#face-" + to,   { rotationY: "+=180", duration: 0.34, ease: "power2.inOut" }, at);
        tl.set("#face-" + to,   { opacity: 1 }, at + 0.17);
        tl.set("#face-" + from, { opacity: 0 }, at + 0.17);
        shown = to;
      }

      function light(region, plate, on, off) {
        flip(plate, Math.max(0, on - 0.26));
        var hl = "#hl-" + region, gl = "#gl-" + region, base = "#fx-" + plate;
        tl.to(base, { filter: "brightness(0.64) saturate(0.76)", duration: 0.22, ease: "power2.out" }, on);
        tl.to(hl, { opacity: 1, duration: 0.22, ease: "power2.out" }, on);
        tl.fromTo(gl, { opacity: 0 }, { opacity: 0.20, duration: 0.24, ease: "power2.out" }, on);
        tl.to(gl, { opacity: 0.11, duration: Math.max(0.18, (off - on - 0.28) / 2),
                    ease: "sine.inOut", yoyo: true, repeat: 1 }, on + 0.26);
        tl.to(hl, { opacity: 0, duration: 0.24, ease: "power2.in" }, off);
        tl.to(gl, { opacity: 0, duration: 0.24, ease: "power2.in" }, off);
        tl.to(base, { filter: "brightness(1) saturate(1)", duration: 0.24, ease: "power2.in" }, off);
      }

/*CUES*/

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
